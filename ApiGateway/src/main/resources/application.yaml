server:
  port: 9056

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      mvc:
        routes:
          - id: USER-SERVICE
            uri: https://httpbin.org
            predicates:
              - Path=/cliente/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9099/eureka/

  instance:
    prefer-ip-address: true